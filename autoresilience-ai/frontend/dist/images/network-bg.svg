<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="1"></path>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#020617"></rect>
  <rect width="100%" height="100%" fill="url(#grid)"></rect>

  <circle cx="300" cy="250" r="5" fill="#38bdf8"></circle>
  <circle cx="700" cy="450" r="5" fill="#38bdf8"></circle>
  <circle cx="1200" cy="300" r="5" fill="#38bdf8"></circle>
  <circle cx="1500" cy="700" r="5" fill="#38bdf8"></circle>

  <line x1="300" y1="250" x2="700" y2="450" stroke="#38bdf8" stroke-width="2"></line>

  <line x1="700" y1="450" x2="1200" y2="300" stroke="#38bdf8" stroke-width="2"></line>

  <line x1="1200" y1="300" x2="1500" y2="700" stroke="#38bdf8" stroke-width="2"></line>
</svg>